<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TrustVault — Secure Document Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070b12;
            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(31, 41, 55, 0.8);
            --emerald: #10b981;
            --emerald-hover: #059669;
            --emerald-glow: rgba(16, 185, 129, 0.25);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12), transparent 70%);
            top: 10%;
            left: 15%;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(50px);
        }

        .ambient-glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(5, 150, 105, 0.08), transparent 70%);
            bottom: 10%;
            right: 15%;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(40px);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03);
            position: relative;
            z-index: 10;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            font-size: 26px;
            margin-bottom: 14px;
            box-shadow: 0 0 25px var(--emerald-glow);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        h1 span {
            color: var(--emerald);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13.5px;
            line-height: 1.5;
        }

        .success-box {
            background: rgba(16, 185, 129, 0.14);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-box {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            background: #0a0e17;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 13px 16px;
            color: #f9fafb;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--emerald);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            background: #0d131f;
        }

        .submit-btn {
            width: 100%;
            background: var(--emerald);
            color: #070b12;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: var(--emerald-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .footer-links {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(31, 41, 55, 0.6);
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--emerald);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: inline-block;
            margin-top: 12px;
            font-size: 12.5px;
            color: #6b7280 !important;
        }

        .home-link:hover {
            color: var(--text-main) !important;
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo">🔐</div>
            <h1>Trust<span>Vault</span></h1>
            <p class="subtitle">Secure, zero-trust confidential document portal</p>
        </div>

        <div id="successBox" class="success-box" style="{% if not registered %}display:none;{% endif %}">
            <span>✅</span>
            <span id="successText">Account created successfully! Please sign in with your credentials.</span>
        </div>

        <div id="alertBox" class="alert-box" style="{% if not error %}display:none;{% endif %}">
            <span>⚠️</span>
            <span id="alertText">{{ error or '' }}</span>
        </div>

        <div style="background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 12px; padding: 14px 16px; margin-bottom: 22px; font-size: 13px;">
            <div style="font-weight: 700; color: #10b981; margin-bottom: 8px;">💡 One-Click Demo Credentials:</div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button type="button" onclick="fillDemo('demo', 'Password123!')" style="background: #111827; border: 1px solid #10b981; color: #10b981; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600;">
                    👤 Auto-fill: demo
                </button>
                <button type="button" onclick="fillDemo('admin', 'AdminPassword123!')" style="background: #111827; border: 1px solid #3b82f6; color: #60a5fa; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600;">
                    🛡️ Auto-fill: admin
                </button>
            </div>
        </div>

        <form id="loginForm" method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Email or Registered Username</label>
                <div class="input-wrapper">
                    <input id="username" name="username" type="text" placeholder="e.g. demo or demo@trustvault.com" required autofocus autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>

            <button id="loginBtn" type="submit" class="submit-btn">
                <span id="loginBtnText">Log In to Vault</span>
                <span id="loginBtnArrow">→</span>
            </button>
        </form>

        <div class="footer-links">
            <p>New to TrustVault? <a href="/register">Create an account</a></p>
            <p><a href="/" class="home-link">← Back to Homepage</a></p>
        </div>
    </div>

    <script>
        // Check URL for registered=1
        if (window.location.search.includes('registered=1')) {
            document.getElementById('successBox').style.display = 'flex';
        }

        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const btnText = document.getElementById('loginBtnText');
        const alertBox = document.getElementById('alertBox');
        const alertText = document.getElementById('alertText');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alertText.textContent = "Please enter both your email/username and password.";
                alertBox.style.display = 'flex';
                return;
            }

            btn.disabled = true;
            btnText.textContent = "Verifying credentials...";
            alertBox.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: username,
                        password: password
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    btnText.textContent = "Success! Opening Vault...";
                    window.location.replace('/dashboard');
                } else {
                    alertText.textContent = data.message || "Invalid credentials. Please verify your details.";
                    alertBox.style.display = 'flex';
                    btn.disabled = false;
                    btnText.textContent = "Log In to Vault";
                }
            } catch (err) {
                // If fetch fails for any network reason, fall back to native form POST
                form.submit();
            }
        });
    </script>
</body>
</html>
