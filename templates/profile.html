<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile &amp; Security | TrustVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #111827;
            --card-border: #1f2937;
            --emerald: #10b981;
            --emerald-hover: #059669;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        nav {
            height: 72px;
            padding: 0 7%;
            background: #0d131f;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
        }

        .brand span { color: var(--emerald); }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-left: 20px;
        }

        .nav-links a:hover { color: var(--emerald); }

        main {
            max-width: 650px;
            margin: 45px auto;
            padding: 0 20px 60px;
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p.sub {
            color: var(--text-muted);
            font-size: 13.5px;
            margin-bottom: 26px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 14px;
        }

        .info-label { color: var(--text-muted); }
        .info-val { font-weight: 700; color: var(--text-main); }

        .role-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--emerald);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .divider {
            margin: 28px 0 22px;
            border-top: 1px solid var(--card-border);
        }

        h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            background: #0a0e17;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 8px;
            margin-top: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus { border-color: var(--emerald); }

        button {
            width: 100%;
            background: var(--emerald);
            color: #0a0e17;
            border: 0;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            margin-top: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: var(--emerald-hover); }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('dashboard') }}" class="brand">🔐 Trust<span>Vault</span></a>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('documents') }}">Documents</a>
            <a href="{{ url_for('logout') }}">Log out</a>
        </div>
    </nav>

    <main>
        <div class="profile-card">
            <h1>Account Profile</h1>
            <p class="sub">View your role and manage account security.</p>

            {% if message %}
                <div class="alert-success">{{ message }}</div>
            {% endif %}

            {% if error %}
                <div class="alert-error">{{ error }}</div>
            {% endif %}

            <div class="info-row">
                <span class="info-label">Username</span>
                <span class="info-val">{{ session.get('username') }}</span>
            </div>

            <div class="info-row">
                <span class="info-label">Role</span>
                <span class="role-badge">{{ session.get('role', 'user') }}</span>
            </div>

            <div class="divider"></div>

            <h2>Change Password</h2>
            <form method="POST" action="/profile">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" required>

                <label for="new_password">New Password (at least 8 characters)</label>
                <input type="password" id="new_password" name="new_password" required minlength="8">

                <button type="submit">Update Password</button>
            </form>
        </div>
    </main>
</body>
</html>
