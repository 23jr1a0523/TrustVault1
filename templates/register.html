<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | TrustVault — Secure Document Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070b12;
            --card-bg: rgba(17, 24, 39, 0.78);
            --card-border: rgba(31, 41, 55, 0.85);
            --emerald: #10b981;
            --emerald-hover: #059669;
            --emerald-glow: rgba(16, 185, 129, 0.25);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12), transparent 70%);
            top: 5%;
            left: 10%;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(60px);
        }

        .ambient-glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(5, 150, 105, 0.08), transparent 70%);
            bottom: 5%;
            right: 10%;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(50px);
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 22px;
            padding: 38px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 10;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            font-size: 26px;
            margin-bottom: 14px;
            box-shadow: 0 0 25px var(--emerald-glow);
        }

        h1 {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        h1 span {
            color: var(--emerald);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13.5px;
            line-height: 1.5;
        }

        .alert-box {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            background: #0a0e17;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 12px 15px;
            color: #f9fafb;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--emerald);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            background: #0d131f;
        }

        .input-hint {
            display: block;
            font-size: 11.5px;
            color: #6b7280;
            margin-top: 5px;
        }

        .security-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 10px;
            padding: 9px 12px;
            margin: 18px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
            color: #a7f3d0;
        }

        .submit-btn {
            width: 100%;
            background: var(--emerald);
            color: #070b12;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: var(--emerald-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(16, 185, 129, 0.35);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .footer-links {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(31, 41, 55, 0.6);
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--emerald);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 12.5px;
            color: #6b7280 !important;
        }

        .home-link:hover {
            color: var(--text-main) !important;
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="auth-card">
        <div class="brand-header">
            <div class="brand-logo">🛡️</div>
            <h1>Create <span>Account</span></h1>
            <p class="subtitle">Join TrustVault's secure confidential document portal</p>
        </div>

        <div id="alertBox" class="alert-box" style="{% if not error %}display:none;{% endif %}">
            <span>⚠️</span>
            <span id="alertText">{{ error or '' }}</span>
        </div>

        <form id="regForm" method="POST" action="/register">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input id="fullName" name="fullName" type="text" placeholder="e.g. Akshaya Kumar" required autocomplete="name" autofocus>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" placeholder="e.g. akshaya@example.com" required autocomplete="email">
                <span class="input-hint">Your email will be used for secure vault notifications &amp; login.</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your password" required minlength="8" autocomplete="new-password">
            </div>

            <div class="security-badge">
                <span>🔒</span>
                <span>Protected by SHA-256 cryptographic integrity &amp; PBKDF2 hashing</span>
            </div>

            <button id="regBtn" type="submit" class="submit-btn">
                <span id="regBtnText">Create Account &amp; Enter Vault</span>
                <span id="regBtnArrow">→</span>
            </button>
        </form>

        <div class="footer-links">
            <p>Already have an account? <a href="/login">Log in to Vault</a></p>
            <p><a href="/" class="home-link">← Back to Homepage</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('regForm');
        const btn = document.getElementById('regBtn');
        const btnText = document.getElementById('regBtnText');
        const alertBox = document.getElementById('alertBox');
        const alertText = document.getElementById('alertText');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Client-side validations
            if (!fullName) {
                alertText.textContent = "Please enter your full name.";
                alertBox.style.display = 'flex';
                return;
            }

            if (!email || !email.includes('@') || !email.includes('.')) {
                alertText.textContent = "Please enter a valid email address.";
                alertBox.style.display = 'flex';
                return;
            }

            if (password.length < 8) {
                alertText.textContent = "Password must have at least 8 characters.";
                alertBox.style.display = 'flex';
                return;
            }

            if (password !== confirmPassword) {
                alertText.textContent = "Passwords do not match. Please verify and try again.";
                alertBox.style.display = 'flex';
                return;
            }

            btn.disabled = true;
            btnText.textContent = "Creating account...";
            alertBox.style.display = 'none';

            try {
                // 1. Send registration to /api/register
                const response = await fetch('/api/register', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        fullName: fullName,
                        email: email,
                        password: password,
                        confirmPassword: confirmPassword
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    btnText.textContent = "Success! Opening Vault...";

                    // 2. Automatically log the user in to establish active session
                    const loginResp = await fetch('/api/login', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });

                    if (loginResp.ok) {
                        window.location.replace('/dashboard');
                    } else {
                        // Fallback to login page with registered notice
                        window.location.replace('/login?registered=1');
                    }
                } else {
                    alertText.textContent = data.message || "Registration failed. Please try again.";
                    alertBox.style.display = 'flex';
                    btn.disabled = false;
                    btnText.textContent = "Create Account & Enter Vault";
                }
            } catch (err) {
                // If fetch fails for network reasons, submit native form POST
                form.submit();
            }
        });
    </script>
</body>
</html>
